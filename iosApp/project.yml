name: iosApp

# Regenerate with:  cd iosApp && xcodegen generate
#
# The on-device assistant uses Apple's Foundation Models (Apple Intelligence), which is part of
# the OS — hence the iOS 26 floor, and no vendored llama.cpp / model download on this platform.

options:
  bundleIdPrefix: dev.aliziwa
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "2600"

settings:
  base:
    SWIFT_VERSION: "5.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 487Q4488BH
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "Info.plist"
          - "iosApp.entitlements"
          - "PrivacyInfo.xcprivacy"
      - path: iosApp/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: SharedSwift
    dependencies:
      - target: TodoWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aliziwa.todo
        PRODUCT_NAME: Doorbell
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Kotlin/Native framework produced by :shared:embedAndSignAppleFrameworkForXcode
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          # DEVELOPER_DIR is already set by Xcode.
          # SKIP_KOTLIN_BUILD=1 reuses the last framework (handy while iterating on Swift).
          if [ "$SKIP_KOTLIN_BUILD" = "1" ]; then
            echo "note: SKIP_KOTLIN_BUILD=1, reusing existing Shared.framework"
            exit 0
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --console=plain

  TodoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TodoWidgets
        excludes:
          - "Info.plist"
          - "TodoWidgets.entitlements"
          - "PrivacyInfo.xcprivacy"
      - path: TodoWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: SharedSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aliziwa.todo.TodoWidgets
        PRODUCT_NAME: TodoWidgets
        INFOPLIST_FILE: TodoWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: TodoWidgets/TodoWidgets.entitlements
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SKIP_INSTALL: YES

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
