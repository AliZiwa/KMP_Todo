name: iosApp

# Regenerate with:  cd iosApp && xcodegen generate
#
# Vendor/llama.xcframework is built from a pinned llama.cpp tag (b11429 == v0.6.0) by
# Vendor/build-llama-xcframework.sh. SPM is NOT usable: ggml-org/llama.cpp ships no
# Package.swift any more, and the official prebuilt release xcframework has no iOS
# simulator slice.

options:
  bundleIdPrefix: dev.aliziwa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "2600"

settings:
  base:
    SWIFT_VERSION: "5.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Simulator builds sign ad-hoc; a real device needs DEVELOPMENT_TEAM filled in.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG LLAMA_ENABLED
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: LLAMA_ENABLED

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "Info.plist"
          - "iosApp.entitlements"
      - path: SharedSwift
    dependencies:
      - target: TodoWidgets
        embed: true
        codeSign: true
      - framework: Vendor/llama.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aliziwa.todo
        PRODUCT_NAME: PersonalTodo
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        ENABLE_BITCODE: NO
        # Kotlin/Native framework produced by :shared:embedAndSignAppleFrameworkForXcode
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          # DEVELOPER_DIR is already set by Xcode.
          # SKIP_KOTLIN_BUILD=1 reuses the last framework (handy while iterating on Swift).
          if [ "$SKIP_KOTLIN_BUILD" = "1" ]; then
            echo "note: SKIP_KOTLIN_BUILD=1, reusing existing Shared.framework"
            exit 0
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --console=plain

  TodoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TodoWidgets
        excludes:
          - "Info.plist"
          - "TodoWidgets.entitlements"
      - path: SharedSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aliziwa.todo.TodoWidgets
        PRODUCT_NAME: TodoWidgets
        INFOPLIST_FILE: TodoWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: TodoWidgets/TodoWidgets.entitlements
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SKIP_INSTALL: YES

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
